# 实验配置:纯稠密向量检索
retrieval:
  method: dense
  top_k: 5

  chunk:
    size: 512
    overlap: 80

  dense:
    embedding_model: BAAI/bge-m3
    index_path: data/processed/dense_index

  generation:
    provider: deepseek
    base_url: https://api.deepseek.com/v1
    llm_model: deepseek-chat
    temperature: 0.2
